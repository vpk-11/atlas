syntax = "proto3";

package atlas.pricing;

import "common.proto";

option java_package = "com.atlas.dispatchservice.grpc.pricing";
option java_multiple_files = true;

service PricingService {
  rpc GetQuote(QuoteRequest) returns (QuoteResponse);
}

// Pricing is a pure calculator with no outbound calls of its own, so Dispatch
// resolves road distance/duration (via OSRM or fallback) before calling here and
// hands the result over as input. pickup/drop are carried too for future
// location-aware surge pricing, unused by the pricing formula in v1.
message QuoteRequest {
  atlas.common.Coordinate pickup = 1;
  atlas.common.Coordinate drop = 2;
  double distance_km = 3;
  double duration_minutes = 4;
}

message QuoteResponse {
  double price = 1;
}
