syntax = "proto3";

package atlas.trip;

import "common.proto";

option java_package = "com.atlas.tripservice.grpc.trip";
option java_multiple_files = true;

service TripService {
  rpc RecordTrip(RecordTripRequest) returns (RecordTripResponse);
  rpc UpdateTripStatus(UpdateTripStatusRequest) returns (UpdateTripStatusResponse);
  rpc CancelTrip(CancelTripRequest) returns (CancelTripResponse);
}

enum TripStatus {
  TRIP_STATUS_UNSPECIFIED = 0;
  MATCHED = 1;
  FAILED_NO_MATCH = 2;
  CANCELLED = 3;
  SYSTEM_ERROR = 4;
  REQUESTED = 5;
}

message RecordTripRequest {
  string rider_id = 1;
  string driver_id = 2;
  atlas.common.Coordinate pickup = 3;
  atlas.common.Coordinate drop = 4;
  double price = 5;
  double distance_km = 6;
  double duration_minutes = 7;
  TripStatus status = 8;
  atlas.common.DistanceSource distance_source = 9;
  // Optional client-supplied key; a repeated key returns the existing row instead
  // of inserting a second one.
  string idempotency_key = 10;
}

message RecordTripResponse {
  string trip_id = 1;
  // True when idempotency_key matched an existing row; the fields below describe it.
  bool replayed = 2;
  TripStatus status = 3;
  string driver_id = 4;
  double price = 5;
  // With replayed: true when the caller now owns the row and may (re)run the match.
  // False for a replay of an unsettled row whose original request may still be running.
  bool resume_granted = 6;
}

// Updates the same row a prior RecordTrip call created (identified by trip_id),
// used to move a REQUESTED row to its final resolved status without creating a
// second row. Fields other than trip_id/status may be blank/zero depending on
// outcome, same convention as RecordTripRequest.
message UpdateTripStatusRequest {
  string trip_id = 1;
  string driver_id = 2;
  double price = 3;
  double distance_km = 4;
  double duration_minutes = 5;
  TripStatus status = 6;
  atlas.common.DistanceSource distance_source = 7;
}

message UpdateTripStatusResponse {
  string trip_id = 1;
}

message CancelTripRequest {
  string trip_id = 1;
}

// driver_id lets Dispatch (owner of the Driver table) free the right driver;
// Trip is the only service that knows which driver a given trip_id belongs to.
message CancelTripResponse {
  string trip_id = 1;
  TripStatus status = 2;
  string driver_id = 3;
}
