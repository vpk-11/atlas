spring:
  application:
    name: trip-service
  datasource:
    url: jdbc:mysql://${TRIP_DB_HOST:localhost}:${TRIP_DB_PORT:3306}/${TRIP_DB_NAME:atlas_trip}?createDatabaseIfNotExist=true
    username: ${TRIP_DB_USER:root}
    password: ${TRIP_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:40}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

trip:
  claim:
    # How long an unsettled row belongs to its original request before a replay may take over.
    # Must exceed a live request's worst case (gRPC deadlines 2s each, OSRM 0.5s).
    lease-seconds: ${TRIP_CLAIM_LEASE_SECONDS:10}
  reconcile:
    stale-seconds: ${TRIP_STALE_REQUESTED_SECONDS:60}
    interval-seconds: ${TRIP_SWEEP_INTERVAL_SECONDS:30}

server:
  port: ${TRIP_SERVICE_HTTP_PORT:8091}

grpc:
  server:
    port: ${TRIP_SERVICE_PORT:9091}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
