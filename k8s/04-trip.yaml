apiVersion: v1
kind: ConfigMap
metadata:
  name: trip-config
  namespace: atlas
data:
  TRIP_SERVICE_HTTP_PORT: "8091"
  TRIP_SERVICE_PORT: "9091"
  TRIP_DB_HOST: "mysql"
  TRIP_DB_PORT: "3306"
  TRIP_DB_NAME: "atlas_trip"
  TRIP_DB_USER: "root"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trip-service
  namespace: atlas
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: trip-service
  template:
    metadata:
      labels:
        app: trip-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8091"
    spec:
      containers:
        - name: trip-service
          image: atlas/trip-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8091
            - containerPort: 9091
          envFrom:
            - configMapRef:
                name: trip-config
          env:
            - name: TRIP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: root-password
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8091
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8091
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: trip-service
  namespace: atlas
spec:
  selector:
    app: trip-service
  ports:
    - name: grpc
      port: 9091
      targetPort: 9091
    - name: http
      port: 8091
      targetPort: 8091
