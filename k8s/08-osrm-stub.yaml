# Local OSRM stand-in for load tests: fixed route, configurable latency. Not part of
# the default deploy path; load-testing/stub-load-test.sh points dispatch-service at it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: osrm-stub-script
  namespace: atlas
data:
  stub.py: |
    import json, os, time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    LATENCY_S = int(os.environ.get("STUB_LATENCY_MS", "50")) / 1000
    BODY = json.dumps({"code": "Ok", "routes": [{"distance": 5000.0, "duration": 600.0}]}).encode()

    class Server(ThreadingHTTPServer):
        request_queue_size = 1024  # default backlog is 5, which drops connections under load
        daemon_threads = True

    class Handler(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"

        def do_GET(self):
            time.sleep(LATENCY_S)
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(BODY)))
            self.end_headers()
            self.wfile.write(BODY)

        def log_message(self, *args):
            pass

    Server(("", 5000), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: osrm-stub
  namespace: atlas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: osrm-stub
  template:
    metadata:
      labels:
        app: osrm-stub
    spec:
      containers:
        - name: stub
          image: python:3.13-slim
          command: ["python", "/app/stub.py"]
          env:
            - name: STUB_LATENCY_MS
              value: "50"
          ports:
            - containerPort: 5000
          readinessProbe:
            tcpSocket:
              port: 5000
            periodSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 2
              memory: 256Mi
          volumeMounts:
            - name: script
              mountPath: /app
      volumes:
        - name: script
          configMap:
            name: osrm-stub-script
---
apiVersion: v1
kind: Service
metadata:
  name: osrm-stub
  namespace: atlas
spec:
  selector:
    app: osrm-stub
  ports:
    - port: 5000
      targetPort: 5000
