apiVersion: v1
kind: ConfigMap
metadata:
  name: pricing-config
  namespace: atlas
data:
  PRICING_SERVICE_HTTP_PORT: "8090"
  PRICING_SERVICE_PORT: "9090"
  CIRCUITY_FACTOR: "1.3"
  AVERAGE_SPEED_MPH: "30"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing-service
  namespace: atlas
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: pricing-service
  template:
    metadata:
      labels:
        app: pricing-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8090"
    spec:
      containers:
        - name: pricing-service
          image: atlas/pricing-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8090
            - containerPort: 9090
          envFrom:
            - configMapRef:
                name: pricing-config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8090
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8090
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: pricing-service
  namespace: atlas
spec:
  selector:
    app: pricing-service
  ports:
    - name: grpc
      port: 9090
      targetPort: 9090
    - name: http
      port: 8090
      targetPort: 8090
