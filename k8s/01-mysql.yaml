# MySQL runs in-cluster (single instance, two schemas: atlas_driver, atlas_trip).
# Storage is a PVC on the default StorageClass (local-path on Kind), so data survives
# a MySQL pod restart; it is lost only when the cluster is deleted. Dispatch still
# reseeds the Driver table in-app on every startup.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
  namespace: atlas
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS atlas_driver;
    CREATE DATABASE IF NOT EXISTS atlas_trip;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: atlas
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: atlas
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4.3
          # Binary log is on by default but nothing replicates or point-in-time-restores
          # here; it only adds an fsync per commit.
          args: ["--skip-log-bin", "--max-connections=400"]
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: root-password
          volumeMounts:
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
            - name: data
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$(MYSQL_ROOT_PASSWORD)"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$(MYSQL_ROOT_PASSWORD)"]
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: init-scripts
          configMap:
            name: mysql-init
        - name: data
          persistentVolumeClaim:
            claimName: mysql-data
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: atlas
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
